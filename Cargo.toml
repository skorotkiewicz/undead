[package]
name = "undead"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
colored = "2"
anyhow = "1"
