[package]
name = "undead"
version = "0.1.8"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
reqwest = { version = "0.11", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
dialoguer = "0.11"
colored = "2"
anyhow = "1"
url = "2"
serde_yaml = "0.9"
rmcp = { version = "0.15", features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "reqwest"] }
openssl = { version = "0.10", features = ["vendored"] }
chrono = "0.4.43"
glob = "0.3"
regex = "1"
crossterm = "0.28"

[profile.release]
opt-level = 3          # Maximum optimizations
debug = false          # No debug info (smaller binary)
lto = "fat"            # Link‑time optimization
codegen-units = 1      # Better optimization, slower compile
panic = "abort"        # Smaller binary, no unwind tables
incremental = false    # Disable incremental compilation
strip = true           # Remove symbol table (requires Rust 1.71+)
